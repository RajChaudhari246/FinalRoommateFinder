<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Roommates - Roommate Finder</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/roommates.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="nav-brand">
        <span class="brand-icon">🏠</span>
        <span>Roommate Finder</span>
      </a>
      <ul class="nav-menu" id="nav-menu"></ul>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </header>

  <!-- Discovery Layout -->
  <main class="main-content">
    <div class="container">

      <!-- Section Switcher Header -->
      <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.75rem;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 2rem; margin-bottom: 0.35rem;" id="page-heading">Discover Roommates</h1>
            <p id="results-count" style="font-size: 0.95rem; color: var(--slate-500);">Searching compatible profiles...</p>
          </div>

          <!-- Section Switcher Tabs -->
          <div class="section-tabs" role="tablist">
            <button type="button" class="section-tab-btn active-all" id="tab-all" onclick="switchSection('all')">
              🌐 All Roommates
            </button>
            <button type="button" class="section-tab-btn" id="tab-girls" onclick="switchSection('female')">
              🌸 Girls Section <span style="font-size: 0.725rem; opacity: 0.85;">(Safe Zone)</span>
            </button>
            <button type="button" class="section-tab-btn" id="tab-boys" onclick="switchSection('male')">
              ⚡ Boys Section <span style="font-size: 0.725rem; opacity: 0.85;">(Living Wing)</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Section Notice Banner (Dynamic) -->
      <div id="section-notice-banner"></div>

      <!-- Main Discovery Layout Grid -->
      <div class="discovery-layout">

        <!-- Left Filters Sidebar -->
        <aside class="filter-card">
          <div class="filter-header">
            <div>
              <h3 id="filter-sidebar-title">Filter Roommates</h3>
              <p id="filter-sidebar-subtitle" style="font-size: 0.785rem; color: var(--slate-500);">Personalized Criteria</p>
            </div>
            <button type="button" id="reset-filters-btn" class="btn-link-reset">Reset</button>
          </div>

          <form id="filter-form">

            <!-- Dynamic Gender & Security Protocol Filters Block -->
            <div id="dynamic-security-filters" style="margin-bottom: 1.25rem;"></div>

            <div class="form-group">
              <label class="form-label" for="filter-location">Location / City / Campus</label>
              <input type="text" id="filter-location" class="form-control" placeholder="e.g. Shirpur, Karwand Naka, RCPIT">
            </div>

            <div class="form-group">
              <label class="form-label">Monthly Rent Share (₹)</label>
              <div style="display: flex; gap: 0.5rem;">
                <input type="number" id="filter-min-budget" class="form-control" placeholder="Min ₹" min="0">
                <input type="number" id="filter-max-budget" class="form-control" placeholder="Max ₹" min="0">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="filter-food">Dietary / Kitchen Habit</label>
              <select id="filter-food" class="form-control">
                <option value="">Any Food</option>
                <option value="vegetarian">Vegetarian</option>
                <option value="vegan">Vegan</option>
                <option value="non-vegetarian">Non-vegetarian</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="filter-smoking">Smoking Preference</label>
              <select id="filter-smoking" class="form-control">
                <option value="">Any Policy</option>
                <option value="non-smoker">Non-smoker Only</option>
                <option value="outside-only">Outside Only</option>
                <option value="smoker">Smoker</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="filter-study">Study & Work Schedule</label>
              <select id="filter-study" class="form-control">
                <option value="">Any Schedule</option>
                <option value="morning">Morning Schedule</option>
                <option value="afternoon">Afternoon Schedule</option>
                <option value="late-night">Late Night</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="filter-sleeping">Sleep Routine</label>
              <select id="filter-sleeping" class="form-control">
                <option value="">Any Schedule</option>
                <option value="early-bird">Early-bird</option>
                <option value="night-owl">Night-owl</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="filter-cleanliness">Cleanliness Standard</label>
              <select id="filter-cleanliness" class="form-control">
                <option value="">Any Standard</option>
                <option value="very-clean">Very Clean</option>
                <option value="moderate">Moderate</option>
                <option value="relaxed">Relaxed</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="filter-roommates">Roommate Count</label>
              <select id="filter-roommates" class="form-control">
                <option value="">Any Household</option>
                <option value="1">1 Roommate</option>
                <option value="2">2 Roommates</option>
                <option value="3">3+ Roommates</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem; padding: 0.75rem;">
              Apply Filters
            </button>
          </form>
        </aside>

        <!-- Right Profiles Grid Section -->
        <section>
          <div class="roommates-grid" id="roommates-list">
            <!-- Roommates rendered dynamically -->
          </div>

          <!-- Pagination Bar -->
          <div id="pagination-bar" style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 2.5rem;"></div>
        </section>

      </div>

    </div>
  </main>

  <!-- Express Interest Modal Dialog -->
  <div class="modal-backdrop" id="interest-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1.25rem;">Express Interest in <span id="modal-target-name">Roommate</span></h3>
        <button type="button" class="modal-close" id="close-interest-modal">&times;</button>
      </div>
      <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 1.25rem;">
        Send a note introducing yourself. If they accept, you'll be able to exchange contact details and coordinate housing viewings.
      </p>
      <form id="send-interest-form">
        <div class="form-group">
          <label class="form-label" for="interest-message">Introduction Message</label>
          <textarea id="interest-message" class="form-control" rows="3" placeholder="Hi! I noticed our budgets and neighborhoods align well. Would love to chat about sharing an apartment!"></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" id="cancel-interest-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="submit-interest-btn" class="btn btn-primary">Send Interest Request</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/roommates.js"></script>
</body>
</html>
